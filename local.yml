# Development stack. Mirrors the Windows/IIS deployment in the ways that
# matter: no broker and no Redis, background work queued to PostgreSQL and run
# by a single worker process. Only the web server differs — runserver here,
# waitress behind IIS there.

volumes:
  enterpriseviz_local_postgres_data: {}
  enterpriseviz_local_postgres_data_backups: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: enterpriseviz_local_django
    container_name: enterpriseviz_local_django
    depends_on:
      - postgres
    volumes:
      - ./backend/:/app:z
    env_file:
      - ./.envs/.local/backend/.django
      - ./.envs/.local/backend/.postgres
    command: /start
    ports:
      - "80:8000"
    healthcheck:
      # Ready once /start has migrated and created the cache table, which is
      # what the worker is really waiting for.
      #
      # A routed URL, not "/": nothing serves the site root, so a check against
      # it 404s. http.client rather than urlopen because it neither follows
      # redirects nor raises on a non-2xx status - any HTTP response at all
      # means the server is up, and /start does not exec it until migrate and
      # createcachetable have finished.
      test: ["CMD", "python", "-c",
             "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=5); c.request('GET', '/enterpriseviz/login/'); c.getresponse()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    build:
      context: .
      dockerfile: ./compose/local/postgres/Dockerfile
    image: enterpriseviz_local_postgres
    container_name: enterpriseviz_local_postgres
    volumes:
      - enterpriseviz_local_postgres_data:/var/lib/postgresql/data
      - enterpriseviz_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/backend/.postgres

  worker:
    <<: *django
    image: enterpriseviz_local_worker
    container_name: enterpriseviz_local_worker
    depends_on:
      django:
        condition: service_healthy
    command: /start-worker
    ports: []
    healthcheck:
      disable: true
    stop_grace_period: 60s
